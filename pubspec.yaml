name: flutter_second_screen
description: A clean architecture Flutter package for managing secondary screens and cross-screen communication on Windows and macOS desktop, with upcoming Android and iOS support.
version: 2.0.0-dev.3
homepage: https://github.com/yusufhnf/flutter_second_screen
repository: https://github.com/yusufhnf/flutter_second_screen
issue_tracker: https://github.com/yusufhnf/flutter_second_screen/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterSecondScreenPluginCApi
        dartPluginClass: WindowsSecondScreenPlatform
      macos:
        pluginClass: FlutterSecondScreenPlugin
        dartPluginClass: MacosSecondScreenPlatform
